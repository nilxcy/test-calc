<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Tape Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400;600&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a desk calculator body beside its printed paper tape; stacks on phones. */
:root {
  --bg: #dfe3df;
  --body: #2c2b28;
  --body-edge: #1d1c1a;
  --key: #3d3c38;
  --key-hi: #4a4944;
  --key-fg: #efede6;
  --fn: #8d8b83;
  --fn-fg: #1d1c1a;
  --accent: #e9a33a;
  --accent-fg: #241a08;
  --screen: #1a1f1c;
  --screen-fg: #d9e8dc;
  --screen-dim: #7f9285;
  --tape: #fbfbf7;
  --ink: #262520;
  --muted: #6f6e67;
  --rule: #d6d5cd;
  --display: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ui: "Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131513; --body: #2a2926; --body-edge: #0c0c0b; --key: #393834; --key-hi: #45443f;
    --key-fg: #efede6; --fn: #77756e; --fn-fg: #141412; --accent: #e9a33a; --accent-fg: #241a08;
    --screen: #0f1311; --screen-fg: #d9e8dc; --screen-dim: #6d8073;
    --tape: #1d1e1b; --ink: #e5e3dc; --muted: #95938c; --rule: #33342f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131513; --body: #2a2926; --body-edge: #0c0c0b; --key: #393834; --key-hi: #45443f;
  --key-fg: #efede6; --fn: #77756e; --fn-fg: #141412; --accent: #e9a33a; --accent-fg: #241a08;
  --screen: #0f1311; --screen-fg: #d9e8dc; --screen-dim: #6d8073;
  --tape: #1d1e1b; --ink: #e5e3dc; --muted: #95938c; --rule: #33342f; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
}
.desk {
  max-width: 760px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: start;
}
@media (max-width: 700px) { .desk { grid-template-columns: minmax(0, 1fr); max-width: 380px; } }

/* Calculator body */
.calc {
  background: var(--body); border-radius: 22px; padding: 20px;
  box-shadow: 0 2px 0 var(--body-edge), 0 18px 40px -18px rgba(0,0,0,.45);
  display: grid; gap: 18px;
}
.brand { display: flex; justify-content: space-between; align-items: baseline; color: var(--fn); }
.brand b { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--key-fg); }
.brand span { font-family: var(--display); font-size: 11px; letter-spacing: .06em; }

.screen {
  background: var(--screen); border-radius: 10px; padding: 14px 16px 12px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
  min-height: 108px; display: grid; align-content: end; gap: 4px; text-align: right;
  font-family: var(--display); font-variant-numeric: tabular-nums; overflow: hidden;
}
.screen .sub { color: var(--screen-dim); font-size: 14px; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; }
.screen .sub bdi { direction: ltr; }
.screen .main { color: var(--screen-fg); font-size: 40px; font-weight: 300; line-height: 1.1; word-break: break-all; }
.screen .main.m { font-size: 30px; }
.screen .main.s { font-size: 22px; }
.screen .main.err { color: var(--accent); }

.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.keys button {
  font: 400 22px/1 var(--display); color: var(--key-fg); background: var(--key);
  border: 0; border-radius: 12px; aspect-ratio: 1 / .86; cursor: pointer;
  box-shadow: 0 3px 0 var(--body-edge); transition: transform .06s, box-shadow .06s, background .12s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.keys button:hover { background: var(--key-hi); }
.keys button:active, .keys button.press { transform: translateY(3px); box-shadow: 0 0 0 var(--body-edge); }
.keys button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys .fn { background: var(--fn); color: var(--fn-fg); font-family: var(--ui); font-weight: 600; font-size: 17px; }
.keys .fn:hover { background: var(--fn); filter: brightness(1.08); }
.keys .op { color: var(--accent); font-size: 26px; }
.keys .op.on { background: var(--key-hi); box-shadow: inset 0 0 0 1.5px var(--accent), 0 3px 0 var(--body-edge); }
.keys .eq { background: var(--accent); color: var(--accent-fg); font-size: 28px; font-weight: 600; }
.keys .eq:hover { background: var(--accent); filter: brightness(1.06); }
.keys .zero { grid-column: span 2; aspect-ratio: auto; }

/* Paper tape */
.tape {
  background: var(--tape); border-radius: 4px 4px 0 0; min-width: 0;
  box-shadow: 0 1px 0 var(--rule), 0 12px 30px -20px rgba(0,0,0,.35);
  position: relative; padding: 18px 20px 26px;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 5.5px, #000 6px) 0 0 / 14px 100% repeat-x;
          mask: radial-gradient(circle 6px at 50% 100%, transparent 5.5px, #000 6px) 0 0 / 14px 100% repeat-x;
}
.tape header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px dashed var(--rule); padding-bottom: 10px; }
.tape h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.tape .clear { font: 500 13px var(--ui); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 0; }
.tape .clear:hover { color: var(--ink); text-decoration: underline; }
.tape .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.rolls { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-variant-numeric: tabular-nums; }
.rolls li { border-bottom: 1px dashed var(--rule); }
.rolls button {
  width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: right;
  padding: 12px 0; cursor: pointer; display: grid; gap: 2px;
}
.rolls button:hover .r { color: var(--accent); }
.rolls button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rolls .x { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rolls .r { font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.rolls .r::before { content: "= "; color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 14px; padding: 16px 0 4px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
kbd { font-family: var(--display); font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 1px 4px; }
@media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>
</head>
<body>

<main class="desk">
  <section class="calc" aria-label="Calculator">
    <div class="brand"><b>Desk Tape</b><span>12-DIGIT</span></div>
    <div class="screen" role="status" aria-live="polite">
      <div class="sub" id="sub"><bdi></bdi></div>
      <div class="main" id="main">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" id="k-ac" data-k="clear">AC</button>
      <button class="fn" id="k-bs" data-k="back" aria-label="Backspace">⌫</button>
      <button class="fn" id="k-pct" data-k="%">%</button>
      <button class="op" id="k-div" data-k="÷">÷</button>
      <button id="k7" data-k="7">7</button><button id="k8" data-k="8">8</button><button id="k9" data-k="9">9</button>
      <button class="op" id="k-mul" data-k="×">×</button>
      <button id="k4" data-k="4">4</button><button id="k5" data-k="5">5</button><button id="k6" data-k="6">6</button>
      <button class="op" id="k-sub" data-k="−">−</button>
      <button id="k1" data-k="1">1</button><button id="k2" data-k="2">2</button><button id="k3" data-k="3">3</button>
      <button class="op" id="k-add" data-k="+">+</button>
      <button id="k-neg" data-k="neg" aria-label="Change sign">±</button>
      <button id="k0" data-k="0">0</button>
      <button id="k-dot" data-k=".">.</button>
      <button class="eq" id="k-eq" data-k="=">=</button>
    </div>
  </section>

  <section class="tape" aria-label="Paper tape">
    <header><h2>Tape</h2><button class="clear" id="clearTape">Tear off</button></header>
    <p class="note" id="exNote" hidden>Example entries. Your own sums replace them.</p>
    <ol class="rolls" id="rolls"></ol>
    <p class="hint">Tap a line to reuse its total. Keyboard works too: <kbd>0–9</kbd> <kbd>+ − * /</kbd> <kbd>Enter</kbd> <kbd>⌫</kbd> <kbd>Esc</kbd></p>
  </section>
</main>

<script>
(() => {
  const OPS = ['+', '−', '×', '÷'];
  const $main = document.getElementById('main');
  const $sub = document.getElementById('sub').firstElementChild;
  const $rolls = document.getElementById('rolls');
  const $exNote = document.getElementById('exNote');

  let tokens = [];        // [{t:'n', v:'12.5'} | {t:'o', v:'+'}]
  let done = false;       // just pressed "="
  let lastExpr = '';

  const EXAMPLES = [
    { x: '18,450 ÷ 3', r: '6,150', ex: true },
    { x: '1,299 × 12 − 2,000', r: '13,588', ex: true },
    { x: '640 + 18%', r: '640.18', ex: true },
  ];
  let tape = null;
  try { tape = JSON.parse(localStorage.getItem('deskTape') || 'null'); } catch (e) {}
  if (!Array.isArray(tape)) tape = EXAMPLES.slice();
  const saveTape = () => { try { localStorage.setItem('deskTape', JSON.stringify(tape.filter(t => !t.ex))); } catch (e) {} };

  const last = () => tokens[tokens.length - 1];

  function group(s) {
    const neg = s.startsWith('-'); if (neg) s = s.slice(1);
    let [i, f] = s.split('.');
    i = (i || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + i + (f !== undefined ? '.' + f : '');
  }
  function fmt(n) {
    if (!isFinite(n)) return 'Error';
    const v = parseFloat(n.toPrecision(12));
    if (v !== 0 && (Math.abs(v) >= 1e15 || Math.abs(v) < 1e-9)) return v.toExponential(6).replace('-', '−');
    return group(String(v));
  }
  const exprText = (ts) => ts.map(t => t.t === 'n' ? group(t.v) : t.v).join(' ');

  function evaluate(ts) {
    ts = ts.slice();
    while (ts.length && ts[ts.length - 1].t === 'o') ts.pop();
    if (!ts.length) return 0;
    const nums = [parseFloat(ts[0].v) || 0], ops = [];
    for (let i = 1; i < ts.length; i += 2) {
      const op = ts[i].v, n = parseFloat(ts[i + 1].v) || 0;
      if (op === '×') nums.push(nums.pop() * n);
      else if (op === '÷') { if (n === 0) return NaN; nums.push(nums.pop() / n); }
      else { ops.push(op); nums.push(n); }
    }
    let r = nums[0];
    ops.forEach((op, i) => { r = op === '+' ? r + nums[i + 1] : r - nums[i + 1]; });
    return r;
  }

  function render() {
    const txt = tokens.length ? exprText(tokens) : '0';
    $main.textContent = txt;
    $main.classList.toggle('err', txt === 'Error');
    $main.classList.toggle('m', txt.length > 12 && txt.length <= 18);
    $main.classList.toggle('s', txt.length > 18);
    if (done) $sub.textContent = lastExpr ? lastExpr + ' =' : '';
    else {
      const hasOp = tokens.some(t => t.t === 'o') && last() && last().t === 'n';
      $sub.textContent = hasOp ? '= ' + fmt(evaluate(tokens)) : '';
    }
    const lo = last();
    document.querySelectorAll('.keys .op').forEach(b => b.classList.toggle('on', !!lo && lo.t === 'o' && lo.v === b.dataset.k));
  }

  function renderTape() {
    $exNote.hidden = !tape.some(t => t.ex);
    $rolls.innerHTML = '';
    if (!tape.length) { $rolls.innerHTML = '<li class="empty">Totals print here when you press =.</li>'; return; }
    tape.forEach((t) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = '<span class="x"></span><span class="r"></span>';
      b.querySelector('.x').textContent = t.x;
      b.querySelector('.r').textContent = t.r;
      b.setAttribute('aria-label', 'Use ' + t.r);
      b.addEventListener('click', () => {
        const v = t.r.replace(/,/g, '').replace('−', '-');
        if (isNaN(parseFloat(v))) return;
        if (done || !tokens.length || last().t === 'n') tokens = [];
        tokens.push({ t: 'n', v }); done = false; render();
      });
      li.appendChild(b); $rolls.appendChild(li);
    });
  }

  function press(k) {
    if (/^\d$/.test(k)) {
      if (done) { tokens = []; done = false; }
      const l = last();
      if (l && l.t === 'n') {
        if (l.v.replace(/[-.]/g, '').length >= 12) return;
        l.v = (l.v === '0') ? k : (l.v === '-0' ? '-' + k : l.v + k);
      } else tokens.push({ t: 'n', v: k });
    } else if (k === '.') {
      if (done) { tokens = []; done = false; }
      const l = last();
      if (l && l.t === 'n') { if (!l.v.includes('.')) l.v += '.'; }
      else tokens.push({ t: 'n', v: '0.' });
    } else if (OPS.includes(k)) {
      if (done) { done = false; }
      if (!tokens.length) tokens.push({ t: 'n', v: '0' });
      if (last().t === 'o') last().v = k; else tokens.push({ t: 'o', v: k });
    } else if (k === 'neg') {
      const l = last();
      if (l && l.t === 'n') l.v = l.v.startsWith('-') ? l.v.slice(1) : '-' + l.v;
      done = false;
    } else if (k === '%') {
      const l = last();
      if (l && l.t === 'n') l.v = String(parseFloat((parseFloat(l.v) / 100).toPrecision(12)));
      done = false;
    } else if (k === 'back') {
      if (done) { tokens = []; done = false; }
      const l = last();
      if (!l) {} else if (l.t === 'o') tokens.pop();
      else { l.v = l.v.slice(0, -1); if (l.v === '' || l.v === '-') tokens.pop(); }
    } else if (k === 'clear') {
      tokens = []; done = false; lastExpr = '';
    } else if (k === '=') {
      while (tokens.length && last().t === 'o') tokens.pop();
      if (!tokens.length || done || tokens.length < 3) { render(); return; }
      const r = evaluate(tokens), rs = fmt(r);
      lastExpr = exprText(tokens);
      if (tape.some(t => t.ex)) tape = [];
      tape.unshift({ x: lastExpr, r: rs }); tape = tape.slice(0, 50);
      saveTape(); renderTape();
      tokens = isFinite(r) ? [{ t: 'n', v: String(parseFloat(r.toPrecision(12))) }] : [];
      if (!isFinite(r)) { $main.textContent = 'Error'; done = true; $sub.textContent = lastExpr + ' ='; $main.classList.add('err'); return; }
      done = true;
    }
    render();
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) press(b.dataset.k);
  });
  document.getElementById('clearTape').addEventListener('click', () => { tape = []; saveTape(); renderTape(); });

  const KEYMAP = { '+': '+', '-': '−', '*': '×', 'x': '×', 'X': '×', '/': '÷', 'Enter': '=', '=': '=',
    'Backspace': 'back', 'Escape': 'clear', 'Delete': 'clear', '%': '%', '.': '.', ',': '.' };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = /^\d$/.test(e.key) ? e.key : KEYMAP[e.key];
    if (!k) return;
    e.preventDefault(); press(k);
    const btn = document.querySelector(`.keys button[data-k="${CSS.escape(k)}"]`);
    if (btn) { btn.classList.add('press'); setTimeout(() => btn.classList.remove('press'), 110); }
  });

  // Open in a working state: a sample sum in progress.
  tokens = [{ t: 'n', v: '1250' }, { t: 'o', v: '×' }, { t: 'n', v: '4' }];
  render(); renderTape();
})();
</script>
</body>
</html>
